[project]
name = "domain-hunter"
version = "0.1.0"
description = "Generate cool domain names, find unowned ones, price them via Porkbun, rank the gems."
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "dnspython>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
dh = "domainhunter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domainhunter"]
