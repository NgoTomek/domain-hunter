name: Hunt gems

# Runs on GitHub's servers — your laptop does not need to be on.
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay under load)
  workflow_dispatch: {}       # manual "Run workflow" button / `gh workflow run hunt.yml`

permissions:
  contents: write             # to commit the gem ledger back to the repo

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Hunt
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
        run: dh hunt --limit 180 --strategy words,seeds,brandable --show 0 --export run.json
      - name: Merge into ledger
        run: python scripts/merge_gems.py run.json
      - name: Commit results
        run: |
          git config user.name "domain-hunter[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gems.json GEMS.md
          git diff --cached --quiet || git commit -m "chore(gems): update ledger [skip ci]"
          git push
