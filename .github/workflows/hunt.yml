name: Hunt gems

# Runs on GitHub's servers — your laptop does NOT need to be on.
# Code comes from `main`; the gem ledger is read + written on the `gems-feed` branch.
on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 min (GitHub may delay under load)
  workflow_dispatch: {}       # manual "Run workflow" button / `gh workflow run hunt.yml`

permissions:
  contents: write             # to push the ledger to gems-feed

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4              # code (main) -> .
      - uses: actions/checkout@v4              # ledger (gems-feed) -> ./feed
        with:
          ref: gems-feed
          path: feed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Hunt + merge
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
        run: |
          mkdir -p data
          [ -f feed/data/gems.json ] && cp feed/data/gems.json data/gems.json || true
          # All strategies (incl. leet fragments), high volume for max coverage.
          dh hunt --limit 700 --show 0 --export run.json || true
          python scripts/merge_gems.py run.json
          mkdir -p feed/data
          cp data/gems.json feed/data/gems.json
          cp GEMS.md feed/GEMS.md
      - name: Publish ledger to gems-feed
        working-directory: feed
        run: |
          git config user.name "domain-hunter[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gems.json GEMS.md
          git diff --cached --quiet || git commit -m "chore(gems): update ledger"
          git push
